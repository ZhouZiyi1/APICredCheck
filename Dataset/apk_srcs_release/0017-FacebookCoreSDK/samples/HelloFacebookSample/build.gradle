apply plugin: 'com.android.application'

dependencies {
    // Facebook Dependencies
    implementation project(':facebook-login')
    implementation project(':facebook-share')
}

android {
    buildToolsVersion = libs.versions.buildToolsVersion.get()
    namespace = "com.cefa.core.demo"
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId 'com.cefa.core.demo'
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdkVersion(31)
    }

    signingConfigs {
        release {
            storeFile rootProject.file('../lawgeek.jks')
            storePassword 'lawgeek'
            keyAlias 'key0'
            keyPassword 'lawgeek'
        }
    }

    lintOptions {
        abortOnError false
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi', 'armeabi-v7a', 'x86'
            universalApk true
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                def abi = output.getFilter(com.android.build.VariantOutput.ABI)
                if (abi == null) {
                    outputFileName = "0017-FacebookCoreSDK-demo.apk"
                } else {
                    outputFileName = "0017-FacebookCoreSDK-demo-${abi}.apk"
                }
            }
        }
    }
}

repositories {
    maven {
        url 'https://maven.google.com/'
        name 'Google'
    }
}
